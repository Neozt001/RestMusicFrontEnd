<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Vue Template</title>
        <!-- Import Styles -->
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
        <link rel="stylesheet" href="./css/styles.css" />
        <!-- Import Vue.js -->
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    </head>
    <body>
        <div id="app">
            <h1> Music Records </h1>

          

            <button id="button1" type="button" v-on:click="clearFilters">Get All Records</button>
            <button id = "button2" v-on:click="showPosts = !showPosts">
                {{ showPosts ? 'Hide posts' : 'Show posts' }}
            </button>

            <section>
                <h2>Add, update or delete a record</h2>
                <input v-model.number="record.id" id="recordId" type="number" placeholder="Record ID for update/delete" />
                <input v-model="record.title" id="recordTitle" type="text" placeholder="Record title" />
                <input v-model="record.artist" id="recordArtist" type="text" placeholder="Record artist" />
                <input v-model.number="record.duration" id="recordDuration" type="number" placeholder="Duration in seconds" />
                <input v-model.number="record.publicationYear" id="recordPublicationYear" type="number" placeholder="Publication year" />
                <button id="addRecordButton" type="button" v-on:click="addRecord">Add</button>
                <button id="deleteRecordButton" type="button" v-on:click="deleteRecord">Delete</button>
                <button id="updateRecordButton" type="button" v-on:click="updateRecord">Update</button>
                <p v-if="successMessage" role="status">{{ successMessage }}</p>
            </section>

            <form v-on:submit.prevent="getAllPosts">
                <input v-model="title" id = "text" placeholder="Filter by title" />
                <input v-model="artist" id="artistFilter" type="text" placeholder="Filter by artist" />
                <input v-model="id" id="idFilter" type="number" placeholder="Filter by ID" />
                <input v-model="duration" id="durationFilter" type="number" placeholder="Filter by duration" />
                <input v-model="publicationYear" id="publicationYearFilter" type="number" placeholder="Filter by publication year" />
                <select v-model="sortBy" v-on:change="getAllPosts" aria-label="Sort records by">
                    <option value="">Default order</option>
                    <option value="id">ID</option>
                    <option value="title">Title</option>
                    <option value="artist">Artist</option>
                    <option value="duration">Duration</option>
                    <option value="publicationYear">Publication year</option>
                </select>
                <button id="searchButton" type="submit">Search</button>
                <button type="button" v-on:click="clearFilters">Clear filters</button>
            </form>

            <p v-if="errorMessage" role="alert">{{ errorMessage }}</p>

            <ul v-if="showPosts">
                <li class="list-group-item" v-for="post in postList" :key="post.id">
                    id: {{ post.id }} - title: {{ post.title }} - artist: {{ post.artist }} - duration: {{ post.duration }} - publication year: {{ post.publicationYear }}
                </li>
            </ul>

            <!-- <button id = "buttonColor" v-on:click="changeButtonColor">Change Button Color</button> -->

        </div>
        <!-- Import App -->
        <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
        <script src="main.js"></script>

        <!-- Mount App -->
       
    </body>
