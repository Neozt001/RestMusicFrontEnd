<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Vue Template</title>
        <!-- Import Styles -->
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
        <link rel="stylesheet" href="./css/styles.css" />
        <!-- Import Vue.js -->
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    </head>
    <body>
        <div id="app">
            <h1> Music Records </h1>

            <button id = "button1" v-on:click="getAllPosts">Get All Records</button>
            <button id = "button2" v-on:click="showPosts = !showPosts">
                {{ showPosts ? 'Hide posts' : 'Show posts' }}
            </button>

            <div>
                <input v-model="title" id = "text" placeholder="Filter by title" />
                <select v-model="sortBy" aria-label="Sort records by">
                    <option value="">Default order</option>
                    <option value="id">ID</option>
                    <option value="title">Title</option>
                    <option value="artist">Artist</option>
                    <option value="duration">Duration</option>
                    <option value="publicationYear">Publication year</option>
                </select>
                <button v-on:click="clearFilters">Clear filters</button>
            </div>

            <div>
                <input v-model="id" type="text" placeholder="Type ID" />
                <input v-model="artist" type="text" placeholder="Type Artist" />
                <input v-model="duration" type="text" placeholder="Type Duration" />
                <input v-model="publicationYear" type="text" placeholder="Type Publication Year" />
            </div>

            <p v-if="errorMessage" role="alert">{{ errorMessage }}</p>

            <ul v-if="showPosts">
                <li class="list-group-item" v-for="post in filteredPosts" :key="post.id">
                    id: {{ post.id }} - title: {{ post.title }} - artist: {{ post.artist }} - duration: {{ post.duration }} - publication year: {{ post.publicationYear }}
                </li>
            </ul>

            <!-- <button id = "buttonColor" v-on:click="changeButtonColor">Change Button Color</button> -->

        </div>
        <!-- Import App -->
        <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
        <script src="main.js"></script>

        <!-- Mount App -->
       
    </body>
